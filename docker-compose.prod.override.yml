services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d/ssl.conf:/etc/nginx/conf.d/ssl-self.conf:ro

  php:
    volumes:
      # 1) Bind the code read-only
      - /opt/fkb-app:/var/www/html:ro
      # 2) Then mount writable named volumes UNDER the bind (these must come after)
      - var_cache:/var/www/html/var
      - vendor_cache:/var/www/html/vendor
