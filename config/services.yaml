# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Hosting settings come from the environment; these defaults suit local dev
    # (front on localhost:3000, API on localhost:8787: same site, so SameSite=Lax is enough).
    env(SESSION_COOKIE_NAME): FKBSESSID
    env(COOKIE_SAMESITE): lax
    env(COOKIE_SECURE): 'false' # true as soon as the API is served over HTTPS
    env(COOKIE_DOMAIN): ''
    env(ALLOWED_ORIGIN_REGEX): '^http://localhost:(3000|8787)$'

services:
    # no extra arguments usually needed
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '@=service("doctrine.dbal.default_connection").getNativeConnection()'
            - { lock_mode: 0 } # LOCK_NONE: parallel requests never wait on a row lock

    App\EventSubscriber\CsrfGuardSubscriber:
        arguments: { $allowedOriginRegex: '%env(ALLOWED_ORIGIN_REGEX)%' }

    app.r2_s3_client:
        class: Aws\S3\S3Client
        arguments:
            - version: 'latest'
              region: '%env(R2_REGION)%'
              endpoint: '%env(R2_ENDPOINT)%'
              use_path_style_endpoint: false
              credentials:
                  key: '%env(R2_ACCESS_KEY_ID)%'
                  secret: '%env(R2_SECRET_ACCESS_KEY)%'

    # --- Tiny wrappers to compute public URLs consistently ---
    App\Service\ProfilePhotoStorage:
        arguments: { $storage: '@profiles.storage', $publicBase: '%env(default::R2_PUBLIC_BASE_URL)%' }

    App\Service\ProjectPhotoStorage:
        arguments: { $storage: '@projects.storage', $publicBase: '%env(default::R2_PUBLIC_BASE_URL)%' }

    App\Service\ComponentPhotoStorage:
        arguments: { $storage: '@components.storage', $publicBase: '%env(default::R2_PUBLIC_BASE_URL)%' }