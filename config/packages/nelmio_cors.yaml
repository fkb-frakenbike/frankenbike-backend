nelmio_cors:
    defaults:
        allow_credentials: true
        allow_origin:
            - 'https://frankenbike.vercel.app'
            - 'http://localhost:3000'
        allow_headers: ['Content-Type', 'Authorization']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        expose_headers: ['Link']
        max_age: 3600

    paths:
        '^/api/':
            allow_origin:
                - 'https://frankenbike.vercel.app'
                - 'http://localhost:3000'
            allow_credentials: true
            allow_headers: ['Content-Type', 'Authorization']
            expose_headers: ['Link']
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            max_age: 3600