flysystem:
    storages:
        profiles.storage:
            adapter: 'aws'
            options:
                client: 'app.r2_s3_client'
                bucket: '%env(R2_BUCKET)%'
                prefix: 'profiles'

        projects.storage:
            adapter: 'aws'
            options:
                client: 'app.r2_s3_client'
                bucket: '%env(R2_BUCKET)%'
                prefix: 'project-covers'

        components.storage:
            adapter: 'aws'
            options:
                client: 'app.r2_s3_client'
                bucket: '%env(R2_BUCKET)%'
                prefix: 'components'

# Dev/test: images on the local disk (prod: Cloudflare R2, above).
# Details and the R2_PUBLIC_BASE_URL to set: see README.md, "Local Image Storage".
when@dev:
    flysystem:
        storages:
            profiles.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/public/uploads/profiles'
            projects.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/public/uploads/project-covers'
            components.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/public/uploads/components'

# Tests write under var/ so they never mix with your local dev images.
when@test:
    flysystem:
        storages:
            profiles.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/test-uploads/profiles'
            projects.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/test-uploads/project-covers'
            components.storage:
                adapter: 'local'
                options:
                    directory: '%kernel.project_dir%/var/test-uploads/components'
