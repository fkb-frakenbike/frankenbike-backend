security:
    # https://symfony.com/doc/current/security/authenticator_manager.html
    # enable_authenticator_manager: true

    hide_user_not_found: false

    # https://symfony.com/doc/current/security.html#c-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

        # ── API side (stateless JWT) ─────────────
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider

            # Lexik JWT authenticator
            jwt: ~

            logout: true
            # acts as entry point when no token is present
            entry_point: jwt
            remember_me:
                secret: '%kernel.secret%'
                signature_properties: [ password ]

        main:
            lazy: true
            provider: app_user_provider
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true

            logout: true

            remember_me:
                secret: '%kernel.secret%'
                signature_properties: [ password ]
                #always_remember_me: true
    # Easy way to control access for large sections of your site
    # ─────────────────────────────────────────────
    # Access rules
    # ─────────────────────────────────────────────
    access_control:
        # Allow unauthenticated calls ONLY to these two API endpoints
        - { path: ^/api/login$,  roles: PUBLIC_ACCESS }
        - { path: ^/api/ping,  roles: PUBLIC_ACCESS }
        - { path: ^/api/users$,  roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/users/\d+/projects$,  roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/projects/\d+/components$,  roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/logout$, roles: PUBLIC_ACCESS }

        # Every other /api/* call needs a valid JWT
        - { path: ^/api,         roles: IS_AUTHENTICATED_FULLY }

        # HTML side
        - { path: ^/admin,       roles: ROLE_ADMIN }
        #- { path: ^/,            roles: PUBLIC_ACCESS }   # homepage, login form, etc.
