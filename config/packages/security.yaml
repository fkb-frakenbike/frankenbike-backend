security:
    # https://symfony.com/doc/current/security/authenticator_manager.html
    # enable_authenticator_manager: true

    hide_user_not_found: false

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # https://symfony.com/doc/current/security.html#c-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

        # ── API side: session + json_login + persistent remember_me ─────────
        api:
            pattern: ^/api
            provider: app_user_provider
            entry_point: App\Security\ApiAuthenticationHandler
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Security\ApiAuthenticationHandler
                failure_handler: App\Security\ApiAuthenticationHandler
            logout: true
            remember_me:
                secret: '%kernel.secret%'
                name: REMEMBERME
                remember_me_parameter: rememberMe
                lifetime: 2592000 # 30 days, sliding: the cookie is re-issued on every use
                token_provider:
                    doctrine: true # series + token in table rememberme_token, 60 s grace built in
                secure: '%env(bool:COOKIE_SECURE)%'
                samesite: '%env(COOKIE_SAMESITE)%'
                domain: '%env(COOKIE_DOMAIN)%'
                httponly: true

        main:
            lazy: true
            provider: app_user_provider
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true

            logout: true

            remember_me:
                secret: '%kernel.secret%'
                signature_properties: [ password ]
                #always_remember_me: true
    # Easy way to control access for large sections of your site
    # ─────────────────────────────────────────────
    # Access rules
    # ─────────────────────────────────────────────
    access_control:
        # Allow unauthenticated calls ONLY to these two API endpoints
        - { path: ^/api/login$,  roles: PUBLIC_ACCESS }
        - { path: ^/api/ping,  roles: PUBLIC_ACCESS }
        - { path: ^/api/users$,  roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/users/[^/]+/projects$,  roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/projects/[^/]+/components$,  roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/logout$, roles: PUBLIC_ACCESS }

        # Every other /api/* call needs a valid JWT
        - { path: ^/api,         roles: IS_AUTHENTICATED }

        # HTML side
        - { path: ^/admin,       roles: ROLE_ADMIN }
        #- { path: ^/,            roles: PUBLIC_ACCESS }   # homepage, login form, etc.
