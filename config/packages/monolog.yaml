# Logs go to stderr as one JSON object per line (read by `docker logs`).
# No file in var/log: the container output is the single source.
monolog:
  handlers:
    main:
      type: stream
      path: php://stderr
      level: debug
      formatter: monolog.formatter.json

when@dev:
  monolog:
    handlers:
      main:
        # The event, doctrine and security channels are very chatty at debug level
        # (every listener call, every SQL query, every authenticator check): they
        # get their own handlers below.
        channels: ["!event", "!doctrine", "!security"]
      noisy_channels:
        # Event and doctrine: only warnings and errors.
        type: stream
        path: php://stderr
        level: warning
        channels: ["event", "doctrine"]
        formatter: monolog.formatter.json
      security_channel:
        # Security: keep the outcomes (login succeeded or failed) at info, drop the debug detail.
        type: stream
        path: php://stderr
        level: info
        channels: ["security"]
        formatter: monolog.formatter.json

when@prod:
  monolog:
    handlers:
      main:
        # Debug/info records are buffered per request and only written, with
        # their context, when the request ends in an error; warnings always pass.
        type: fingers_crossed
        action_level: error
        passthru_level: warning
        excluded_http_codes: [404]
        handler: nested
      nested:
        type: stream
        path: php://stderr
        level: debug
        formatter: monolog.formatter.json

when@test:
  monolog:
    handlers:
      main:
        # Keep test output quiet: only crashes reach stderr.
        level: critical
