name: Deploy PROD (App VM)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build & Deploy on PROD VM
    runs-on: [ self-hosted, Linux, X64 ]

    env:
      APP_DIR: /opt/fkb-app
      RUN_MIGRATIONS: "0"  # set to "1" when DB is ready
      BACKUP: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to $APP_DIR (exclude secrets & protect compiled env)
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='backups/' \
            --exclude='releases/' \
            --exclude='.env.prod.local' \
            --exclude='.env.local.php' \
            --filter='protect .env.local.php' \
            --exclude='jwt/*' \
            ./ "$APP_DIR"/

      - name: Verify compose files
        run: |
          ls -la "$APP_DIR"
          [ -f "$APP_DIR/docker-compose.prod.yml" ] || (echo "❌ Missing docker-compose.prod.yml"; exit 1)
          [ -f "$APP_DIR/docker-compose.prod.override.yml" ] || (echo "❌ Missing docker-compose.prod.override.yml"; exit 1)

      - name: Deploy
        run: |
          chmod +x "$APP_DIR/deploy.sh"
          RUN_MIGRATIONS="${RUN_MIGRATIONS}" BACKUP="${BACKUP}" bash "$APP_DIR/deploy.sh"
