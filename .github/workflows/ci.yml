name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/fkb_db_test
      APP_SECRET: ${{ secrets.APP_SECRET }}
      CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN }}
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fkb_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Symfony
        run: |
          cat << EOF > .env
          APP_ENV=test
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/fkb_db_test"
          CORS_ALLOW_ORIGIN=${{ secrets.CORS_ALLOW_ORIGIN }}
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          EOF

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_mysql
          coverage: xdebug

      - name: Wait for MySQL
        run: |
          until mysql -h 127.0.0.1 -u root -proot -e "SELECT 1"; do
            sleep 2
          done

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Create test database (raw SQL)
        run: |
          mysql -h 127.0.0.1 -u root -proot -e \
            "CREATE DATABASE IF NOT EXISTS fkb_db_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --overwrite -n

      - name: Update schema
        run: php bin/console doctrine:schema:update --env=test --force

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-text
