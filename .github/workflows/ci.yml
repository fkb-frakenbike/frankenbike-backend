name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fkb_db?serverVersion=17&charset=utf8
      APP_SECRET: ${{ secrets.APP_SECRET }}
      CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN }}
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fkb_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
#You cannot “fix” an old run; the workflow used the file that existed at that time.
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Symfony
        run: |
          cat << EOF > .env
          APP_ENV=test
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/fkb_db?serverVersion=17&charset=utf8"
          CORS_ALLOW_ORIGIN=${{ secrets.CORS_ALLOW_ORIGIN }}
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
          EOF

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_pgsql
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --overwrite -n

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-text
