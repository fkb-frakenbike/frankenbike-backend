name: Dev CI/CD
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: composer audit || true
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Install rsync on runner
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Ensure rsync on VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'command -v rsync >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y rsync)'

      - name: Rsync code to VM
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env.dev.local' \
            --exclude 'config/jwt/*.pem' \
            --exclude 'var/cache/*' \
            --exclude 'var/log/*' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/fkb-dev/

      - name: Rebuild stack
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd /opt/fkb-dev && docker compose -f docker-compose.yml -f docker-compose.dev.override.yml -f docker-compose.phpfpm.override.yml up -d --build'

      - name: Healthcheck
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'for i in {1..20}; do code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8788/api/ping); [ "$code" = "200" ] && echo OK && exit 0; sleep 3; done; echo FAIL; exit 1'

