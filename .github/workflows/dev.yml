name: Dev CI/CD
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: composer audit || true
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Install rsync on runner
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Ensure rsync on VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'command -v rsync >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y rsync)'

      - name: Rsync code to VM
        run: |
          rsync -az --delete --no-perms --omit-dir-times \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '.env.dev.local' \
            --exclude 'config/jwt/*.pem' \
            --exclude 'var/***' \
            --exclude 'vendor/***' \
            --exclude '.env.dev.local' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/fkb-dev/


      - name: Ensure .env on VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /opt/fkb-dev &&
            if [ ! -f .env ]; then
              {
                echo 'COMPOSE_PROJECT_NAME=fkbdev';
                echo 'DEV_HTTP_PORT=8788';
                echo 'MYSQL_ROOT_PASSWORD=root';
                echo 'MYSQL_DATABASE=fkb_db_dev';
                echo 'MYSQL_USER=fkb_dev_user';
                echo 'MYSQL_PASSWORD=Str0ng_Dev_Pass_2025';
              } > .env
            fi"

      - name: Rebuild stack
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd /opt/fkb-dev && sudo docker compose -f docker-compose.yml -f docker-compose.dev.override.yml -f docker-compose.phpfpm.override.yml up -d --build'

      - name: Healthcheck
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'for i in {1..20}; do code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8788/api/ping); [ "$code" = "200" ] && echo OK && exit 0; sleep 3; done; echo FAIL; exit 1'

      - name: Ensure .env on VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/fkb-dev && [ -f .env ] || printf '%s\n' \
COMPOSE_PROJECT_NAME=fkbdev
DEV_HTTP_PORT=8788
MYSQL_ROOT_PASSWORD=root
MYSQL_DATABASE=fkb_db_dev
MYSQL_USER=fkb_dev_user
MYSQL_PASSWORD=Str0ng_Dev_Pass_2025
> .env"

      - name: Ensure php-fpm override
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /opt/fkb-dev &&
            {
              echo 'services:';
              echo '  php:';
              echo '    command: [\"php-fpm\"]';
              echo '    ports: []';
            } > docker-compose.phpfpm.override.yml"

      - name: Rebuild stack
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd /opt/fkb-dev && sudo docker compose -f docker-compose.yml -f docker-compose.dev.override.yml -f docker-compose.phpfpm.override.yml up -d --build'

      - name: Healthcheck
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'for i in {1..20}; do code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8788/api/ping); [ "$code" = "200" ] && echo OK && exit 0; sleep 3; done; echo FAIL; exit 1'
