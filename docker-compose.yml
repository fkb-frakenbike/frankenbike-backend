services:
  postgres:
    image: postgres:17-alpine
    container_name: fkb-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fkb}
      POSTGRES_DB: ${POSTGRES_DB:-fkb_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./docker/php/
      dockerfile: Dockerfile
    container_name: fkb-php
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["bash", "-c", "[ ! -d 'vendor' ] && composer install || echo 'Dependencies already installed'; php -S 0.0.0.0:8000 -t public"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8000"

volumes:
  postgres_data:
