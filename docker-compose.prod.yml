services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fkb-php
    restart: always
    working_dir: /var/www/html
    volumes:
      - var_cache:/var/www/html/var
      - vendor_cache:/var/www/html/vendor
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: fkb-nginx
    restart: always
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - var_cache:/var/www/html/var
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

volumes:
  var_cache:
    external: true
    name: fkb-app_var_cache
  vendor_cache:
    external: true
    name: fkb-app_vendor_cache

networks:
  appnet:
    driver: bridge
