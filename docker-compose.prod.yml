services:
  php:
    build:
      context: .
    container_name: fkb-php
    restart: always
    working_dir: /var/www/html
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: fkb-nginx
    restart: always
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

networks:
  appnet:
    driver: bridge
